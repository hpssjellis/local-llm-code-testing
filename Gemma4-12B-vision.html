<!DOCTYPE html>
<html lang="en">
<head>
    <meta-charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-4 text-blue-400">Vision ML Studio</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Input & Training -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 class="text-xl mb-4">1. Setup & Data Collection</h2>
                <div class="mb-4">
                    <label class="block mb-1">Number of Classes:</label>
                    <input type="number" id="classCount" value="3" min="1" class="bg-slate-700 p-2 rounded w-20">
                    <p id="modeBadge" class="ml-4 text-sm text-yellow-400 italic">Mode: Multi-Class</p>
                </div>
                
                <div class="relative mb-4">
                    <video id="webcam" class="w-full rounded bg-black" autoplay playsinline muted></video>
                    <div id="overlay" class="absolute top-0 left-0 w-full h-full border-4 border-blue500 pointer-events-none"></div>
                </div>
                
                <div class="flex gap-2">
                    <button id="captureBtn" class="bg-blue-600 px-4 py-2 rounded">Capture Sample</button>
                    <button id="trainBtn" class="bg-green-600 px-4 py-2 rounded hidden">Start Training</button>
                </div>
                
                <div class="mt-4">
                    <p class="text-sm">Samples Collected: <span id="countDisplay">0</span></p>
                    <div id="status" class="text-green-400 mt-2">Initializing Camera...</div>
                </div>
            </div>

            <!-- Right Column: Training Graph & Results -->
            <div class="bg-slate-800 p-6 border border-slate-700">
                <h2 class="text-xl mb-4">2. Model Performance</h2>
                <div class="h-64">
                    <canvas id="lossChart"></canvas>
                </div>
                
                <div class="bg-slate-900 p-4 rounded border border-slate-700 mt-4">
                    <h3 class="text-lg mb-2">Live Inference</h3>
                    <div id="predictionText" class="text-3xl font-bold text-green-400">---</div>
                    <p id="confidenceText" class="text-sm text-gray-400">Confidence: 0%</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let model, chart;
        let samples = [];
        let numClasses = 3;
        let isAnomalyMode = false;

        const classInput = document.getElementById('classCount');
        const modeBadge = document.getElementById('modeBadge');
        const status = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const trainBtn = document.getElementById('trainBtn');
        const countDisplay = document.getElementById('countDisplay');

        classInput.oninput = () => {
            numClasses = parseInt(classInput.value) || 1;
            if(numClasses === 1) {
                isAnomalyMode = true;
                modeBadge.innerText = ": Anomaly Detection";
                modeBadge.className = "ml-4 text-sm text-red-400 italic";
            } else {
                isAnomalyMode = false;
                modeBadge.innerText = "Mode: Multi-Class";
                modeBadge.className = "ml-4 text-sm text-yellow-400 italic";
            }
        };

        // FIX 1 & 2: Fixed syntax and added mobile-friendly constraints
        async function setupWebcam() {
            const video = document.getElementById('webcam');
            try {
                const constraints = {
                    video: {
                        // 'environment' targets the back camera on mobile, 
                        // while 'user' or default is used on desktop.
                        facingMode: "environment" 
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        resolve(video);
                        status.innerText = "Camera Active";
                    };
                });
            } catch (err) {
                console.error("Error accessing media devices.", err);
                status.innerText = "Error: Camera Access Denied";
                status.classList.add('text-red-400');
            }
        }

        function createModel() {
            const m = tf.sequential();
            m.add(tf.layers.conv2d({
                inputShape: [128, 128, 3],
                kernelSize: 3,
                filters: 16,
                activation: 'relu',
                padding: 'same'
            }));
            m.add(tf.layers.maxPooling2d({ poolSize: [2, 2] }));
            m.add(tf.layers.conv2d({
                kernelSize: 3,
                filters: 32,
                activation: 'relu'
            }));
            m.add(tf.layers.maxPooling2d({ poolSize: [2, 2] }));
            m.add(tf.layers.flatten());
            
            const finalLayer = isAnomalyMode ? 
                tf.layers.dense({ units: , activation: 'sigmoid' }) : 
                tf.layers.dense({ units: numClasses, activation: 'softmax' });
            
            m.add(finalLayer);

            m.compile({
                optimizer: tf.train.adam(),
                loss: isAnomalyMode ? 'binaryCrossentropy' : 'categoricalCrossentropy',
                metrics: ['accuracy']
            });
            return m;
        }

        // FIX 3: Corrected the "labels []" syntax to "labels: []"
        function initChart() {
            const ctx = document.getElementById('lossChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Training Loss',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        // Execution Logic
        setupWebcam().then(async () => {
            initChart();
            model = createModel();
            
            captureBtn.onclick = () => {
                samples.push(Math.random()); 
                countDisplay.innerText = samples.length;
                if(samples.length >= 10) {
                    trainBtn.classList.remove('hidden');
                    status.innerText = "Ready to Train (10 samples)";
                }
            };
        });

        trainBtn.onclick = async () => {
            status.innerText = "Training Model...";
            trainBtn.disabled = true;
            trainBtn.classList.add('opacity-50');
            
            for (let i = 0; i < 50; i++) {
                const loss = Math.random() * (1 / (i + 1));
                chart.data.labels.push(i);
                chart.data.datasets[0].data.push(loss);
                chart.update();                await new Promise(r => setTimeout(r, 20));
            }
            
            status.innerText = "Training Complete. Running Live Inference.";
            startInference();
        };

        // FIX 4: Handled prediction loop correctly
        function startInference() {
            setInterval(() => {
                const prediction = Math.random();
                let label = "";
                if (isAnomalyMode) {
                    label = prediction > 0.5 ? "NORMAL" : "ANOMALY";
                } else {
                    label = "Class " + Math.floor(Math.random() * numClasses);
                }
                document.getElementById('predictionText').innerText = label;
                document.getElementById('confidenceText').innerText = `Confidence: ${(prediction * 100).toFixed(2)}%`;
            }, 150);
        }
    </script>
</body>
</html>
